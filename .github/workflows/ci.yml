name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet and test
        run: make test
      - name: Build all architectures
        run: make build-all
      - name: Check completion scripts
        run: |
          sudo apt-get install -y --no-install-recommends zsh fish
          bash -n completions/yap.bash
          zsh -n completions/_yap
          fish -n completions/yap.fish
